name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Compilar (instalador + portátil)
        shell: cmd
        run: echo.| build.bat
      - name: Autoteste do .exe
        shell: pwsh
        run: |
          Start-Process dist\Portinho\Portinho.exe -ArgumentList "--selftest" -Wait
          Get-Content dist\Portinho\portinho_selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Portinho-windows
          path: |
            dist/Portinho-Setup-*.exe
            dist/Portinho.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 fakeroot libegl1 libgl1 libxkbcommon-x11-0
      - run: ./packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Portinho-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  release:
    # publica os instaladores na página de Releases ao criar uma tag v* (ex.: v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
